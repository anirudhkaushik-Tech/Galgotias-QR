<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>

    <!-- Google tag (gtag.js) - FIXED ASSET PATH -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // =============================================================
      // CONFIGURATION: UPDATE THESE FIELDS FOR NEW CAMPAIGNS
      // =============================================================
      const CAMPAIGN_NAME = "Test Campaign";    // Campaign Name
      
      const URL_DEFAULT = "https://yourwebsite.com";  // Website Url
      const URL_IPHONE  = "https://apple.com";        // Iphone Url if apple store or website url
      const URL_ANDROID = "https://google.com";       // Android Url if play store or website url
      // =============================================================

      // 1. Device Detection Logic
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      let finalDestination = URL_DEFAULT;
      let detectedDevice = "Desktop/Other";

      if (/android/i.test(userAgent)) {
          detectedDevice = "Android";
          finalDestination = URL_ANDROID || URL_DEFAULT;
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
          detectedDevice = "iOS";
          finalDestination = URL_IPHONE || URL_DEFAULT;
      }

      // 2. Log Data to Google Analytics (GA4)
      gtag('config', 'G-GX6ECYKV0D', {
        'page_title': 'Smart QR Redirect',
        'campaign_source': 'printed_qr',
        'campaign_medium': 'print',
        'campaign_name': CAMPAIGN_NAME
      });

      // Custom event logging the scanner's device ecosystem
      gtag('event', 'qr_scan', {
        'campaign_run': CAMPAIGN_NAME,
        'device_type': detectedDevice
      });

      // 3. Execute Smooth Routing (Delayed to 1.5s to display the logo animation smoothly)
      setTimeout(function() {
          window.location.href = finalDestination;
      }, 1500);
    </script>

    <style>
        /* White clean background to perfectly fit the logo shape matrix */
        body {
            background-color: #ffffff; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* -------------------------------------------------------------
           LOGO ANIMATION STYLES (Elegant slow spin & pulse glow)
           ------------------------------------------------------------- */
        .animated-logo {
            width: 140px;         
            height: 140px;
            object-fit: contain;
            animation: elegantSpinGlow 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes elegantSpinGlow {
            0% {
                transform: scale(0.9) rotate(0deg);
                filter: drop-shadow(0 0 0px rgba(0, 0, 0, 0));
            }
            50% {
                transform: scale(1.05) rotate(180deg);
                /* Emits a blended orange/red glow pulled directly from the logo artwork shades */
                filter: drop-shadow(0 4px 25px rgba(234, 88, 12, 0.45)); 
            }
            100% {
                transform: scale(0.9) rotate(360deg);
                filter: drop-shadow(0 0 0px rgba(0, 0, 0, 0));
            }
        }

        .loading-text {
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.75px;
            text-transform: uppercase;
            animation: fadeText 1.5s ease-in-out infinite;
        }

        @keyframes fadeText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- Pulls the logo image located in your repository root folder -->
        <img class="animated-logo" 
             src="logo.png" 
             alt="University Logo">
             
        <div class="loading-text">Connecting Securely...</div>
    </div>

</body>
</html>
