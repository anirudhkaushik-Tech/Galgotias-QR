<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // =============================================================
      // CONFIGURATION: UPDATE THESE FIELDS FOR NEW CAMPAIGNS
      // =============================================================
      const CAMPAIGN_NAME = "Test Campaign";    // Campaign Name
      
      const URL_DEFAULT = "https://yourwebsite.com";  // Website Url
      const URL_IPHONE  = "https://apple.com";        // Iphone Url if apple store or website url
      const URL_ANDROID = "https://google.com";       // Android Url if play store or website url
      // =============================================================

      // 1. Device Detection Logic
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      let finalDestination = URL_DEFAULT;
      let detectedDevice = "Desktop/Other";

      if (/android/i.test(userAgent)) {
          detectedDevice = "Android";
          finalDestination = URL_ANDROID || URL_DEFAULT;
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
          detectedDevice = "iOS";
          finalDestination = URL_IPHONE || URL_DEFAULT;
      }

      // 2. Log Data to Google Analytics (GA4)
      gtag('config', 'G-GX6ECYKV0D', {
        'page_title': 'Smart QR Redirect',
        'campaign_source': 'printed_qr',
        'campaign_medium': 'print',
        'campaign_name': CAMPAIGN_NAME
      });

      // Custom event logging the scanner's device ecosystem
      gtag('event', 'qr_scan', {
        'campaign_run': CAMPAIGN_NAME,
        'device_type': detectedDevice
      });

      // 3. Execute Smooth Routing (Delayed to 1.5s to display the light animation)
      setTimeout(function() {
          window.location.href = finalDestination;
      }, 1500);
    </script>

    <style>
        body {
            background-color: #ffffff; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* -------------------------------------------------------------
           ROTATING BORDER LIGHTS STYLES (Logo stays static)
           ------------------------------------------------------------- */
        .light-ring-wrapper {
            position: relative;
            width: 146px;
            height: 146px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Matches the red, orange, and blue palette tones of your logo */
            background: conic-gradient(#ea580c, #3b82f6, #dc2626, #ea580c);
            animation: spinLights 2s linear infinite;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        @keyframes spinLights {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Inner mask prevents the logo from spinning back with the border background */
        .static-logo-container {
            position: absolute;
            width: 138px;
            height: 138px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Cancels out the parent spin so the logo remains completely upright */
            animation: counterSpin 2s linear infinite;
        }

        @keyframes counterSpin {
            100% {
                transform: rotate(-360deg);
            }
        }

        .logo-img {
            width: 130px;         
            height: 130px;
            object-fit: contain;
        }

        .loading-text {
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.75px;
            text-transform: uppercase;
            animation: fadeText 1.5s ease-in-out infinite;
        }

        @keyframes fadeText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- Spinning light container wrapper -->
        <div class="light-ring-wrapper">
            <!-- Non-spinning counter mask containing the logo -->
            <div class="static-logo-container">
                <img class="logo-img" 
                     src="logo.png" 
                     alt="University Logo">
            </div>
        </div>
             
        <div class="loading-text">Connecting Securely...</div>
    </div>

</body>
</html>
